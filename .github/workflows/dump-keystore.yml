name: Dump keystore (temporary)
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Write keystore
        env:
          KEYSTORE_B64: ${{ secrets.IMMICH_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.IMMICH_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.IMMICH_KEY_ALIAS }}
        run: |
          set -e
          echo "$KEYSTORE_B64" | base64 -d > key.jks
          chmod 600 key.jks
          ls -lh key.jks
          keytool -list -v -keystore key.jks -storepass "$STORE_PASS" -alias "$KEY_ALIAS" 2>/dev/null | grep -E "Alias|SHA256:|Valid from" | head -5
          echo "$STORE_PASS" > storepass.txt
          echo "$KEY_ALIAS" > alias.txt
          mkdir -p out
          cp key.jks storepass.txt alias.txt out/
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: out/
          retention-days: 1
