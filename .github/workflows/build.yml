name: Build Immich APK (background upload patch)

on:
  workflow_dispatch:
    inputs:
      immich_version:
        description: 'Immich version tag (e.g. v3.3.5)'
        required: true
        default: 'v3.3.5'
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - '.github/workflows/**'

env:
  IMMICH_VERSION: ${{ github.event.inputs.immich_version || 'v3.3.5' }}
  FLUTTER_VERSION: '3.47.2'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Checkout Immich source
        run: |
          git clone --depth 1 --branch "$IMMICH_VERSION" \
            https://github.com/immich-app/immich.git immich
          echo "Immich $IMMICH_VERSION ready"
          du -sh immich

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Apply patches
        run: |
          set -e
          chmod +x patches/*.sh || true
          for f in patches/*.sh; do
            [ -f "$f" ] || continue
            echo "=== applying $f ==="
            bash "$f"
          done

      - name: Generate OpenAPI Dart SDK
        run: |
          set -e
          cd immich
          npm install -g @openapitools/openapi-generator-cli
          # 版本由 open-api/openapitools.json 自动决定（7.25.0），不要显式传参
          cd open-api
          bash ./bin/generate-dart-sdk.sh

      - name: pub get
        run: |
          cd immich/mobile
          flutter pub get
          echo "=== background_downloader 实际版本 ==="
          grep -A1 'background_downloader' pubspec.lock | head -4 || true
          ls -d "$HOME"/.pub-cache/hosted/*/background_downloader-* 2>/dev/null || true

      - name: Re-apply pub-cache patches
        run: |
          # background_downloader 在 pub get 后才落到 pub-cache，
          # 所以这一步必须放在 pub get 之后
          bash patches/00-kotlin-serialization-fix.sh

      # 官方 CI 在编译前必跑 codegen（mise //mobile:codegen）：
      # build_runner / drift / pigeon / i18n。缺任何一项都会编译失败，
      # 报 StaticTranslations、BackgroundWorkerLockApi、context.t 等未定义。
      - name: Codegen — pigeon (platform channels)
        run: |
          cd immich/mobile
          ls pigeon/*.dart | xargs -n1 -P4 -I{} dart run pigeon --input {}
          dart format lib/platform/

      - name: Codegen — drift migrations
        run: |
          cd immich/mobile
          dart run drift_dev make-migrations

      - name: Codegen — i18n translations
        run: |
          # 对应官方 mise 任务 i18n:loader + i18n:keys
          cd immich/mobile
          dart run easy_localization:generate -S ../i18n
          dart format lib/generated/codegen_loader.g.dart
          dart run bin/generate_keys.dart
          dart format lib/generated/translations.g.dart

      - name: Codegen — build_runner
        run: |
          cd immich/mobile
          dart run build_runner build --delete-conflicting-outputs
          dart format lib/routing/router.gr.dart

      - name: Build APK
        run: |
          cd immich/mobile
          flutter build apk --release --target-platform android-arm64

      - name: Collect APK
        run: |
          mkdir -p out
          cp immich/mobile/build/app/outputs/flutter-apk/*.apk out/ || true
          ls -lh out/
          sha256sum out/*.apk > out/SHA256SUMS || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: immich-apk-${{ env.IMMICH_VERSION }}
          path: out/
          retention-days: 30

      # 同时发布到 Release，便于用镜像站加速下载
      # （Actions artifact 需要 token 认证，无法走镜像）
      - name: Publish to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="build-$(date +%Y%m%d-%H%M%S)"
          NOTES="Immich ${IMMICH_VERSION} + background-upload patches"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "$NOTES" \
            out/*.apk out/SHA256SUMS || true
          echo "发布完成: $TAG"
